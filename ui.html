<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV | UI Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07090f;
            --surface: #0f1322;
            --surface-glass: rgba(15, 19, 34, 0.75);
            --border-subtle: rgba(0, 255, 204, 0.1);
            --border-hover: rgba(0, 255, 204, 0.5);
            --accent-cyan: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.2;
        }

        .cyber-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(7, 9, 15, 0.95) 90%);
            z-index: 2; pointer-events: none;
        }

        .back-btn {
            position: fixed; top: 20px; left: 20px;
            color: var(--accent-cyan); text-decoration: none; font-weight: 600;
            z-index: 100; border: 1px solid var(--border-subtle);
            padding: 10px 20px; border-radius: 10px;
            background: var(--surface-glass); backdrop-filter: blur(15px);
            transition: all 0.3s ease; letter-spacing: 1px; font-family: monospace; font-size: 0.8rem;
        }
        .back-btn:hover {
            border-color: var(--accent-cyan);
            background: var(--accent-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .construction-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 0 2rem;
        }

        .alert-icon { font-size: 4rem; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--accent-glow)); animation: pulse 2s infinite; }
        
        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3rem, 7vw, 5rem);
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            text-shadow: 0 0 30px var(--accent-glow);
            letter-spacing: -1px;
        }

        .status-tag {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--accent-cyan);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 20px;
            font-family: monospace;
            font-weight: 600;
        }
        
        p { color: var(--text-muted); max-width: 500px; line-height: 1.6; margin-top: 20px; font-size: 0.95rem; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="cyber-overlay"></div>
    <a href="index.html" class="back-btn">&larr; EXIT</a>

    <div class="construction-wrapper">
        <div class="alert-icon">⚠️</div>
        <h1>Work in Progress</h1>
        <div class="status-tag">Interface Archive Locked</div>
        <p>The UI Design portfolio is currently being updated with new frameworks and modern layouts. Check back soon.</p>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const letters = '01XYZABCDEF';
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        let drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(7, 9, 15, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffcc';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);
    </script>
</body>
</html>
