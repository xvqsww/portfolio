<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV | Map Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #030303; 
            --red: #ff0000; 
            --glass: rgba(255, 255, 255, 0.03); 
            --card-round: 24px;
        }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        .back-btn { position: fixed; top: 20px; left: 20px; color: var(--red); text-decoration: none; font-weight: bold; z-index: 100; border: 1px solid var(--red); padding: 10px 20px; border-radius: 12px; background: rgba(0,0,0,0.8); transition: 0.3s; letter-spacing: 2px; backdrop-filter: blur(10px); }
        .back-btn:hover { background: var(--red); color: black; box-shadow: 0 0 20px rgba(255,0,0,0.4); }

        .container { position: relative; z-index: 10; padding: 80px 10%; text-align: center; }
        h1 { font-family: 'UnifrakturMaguntia', serif; color: var(--red); font-size: 4rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,0,0,0.4); }
        p.subtitle { color: #666; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 50px; font-size: 0.8rem; }

        .gallery-grid { display: flex; flex-direction: column; gap: 40px; align-items: center; }
        
        .gallery-item-flex { 
            display: flex; 
            background: var(--glass); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            width: 100%; 
            max-width: 900px; 
            border-radius: var(--card-round);
            backdrop-filter: blur(15px); 
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            text-align: left;
            min-height: 250px;
        }

        .gallery-item-flex:hover { 
            border-color: rgba(255, 0, 0, 0.5); 
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(255,0,0,0.1);
        }

        .item-image { flex: 0 0 45%; border-right: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; background: #000; }
        .item-image img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s ease; filter: brightness(0.8); }
        .gallery-item-flex:hover img { transform: scale(1.05); filter: brightness(1.1); }

        .item-details { flex: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .item-details h3 { font-family: 'UnifrakturMaguntia', serif; color: var(--red); font-size: 2.2rem; margin: 0 0 10px 0; }
        .item-details .desc { color: #aaa; line-height: 1.6; font-size: 0.95rem; margin-bottom: 20px; }

        /* Price Row */
        .price-row { display: flex; align-items: center; gap: 15px; font-weight: bold; font-size: 1.3rem; margin-bottom: 25px; }
        .price-usd { color: #00ff00; }
        .price-sep { font-size: 0.75rem; color: #555; letter-spacing: 2px; }
        .price-robux { display: flex; align-items: center; gap: 8px; color: #ffaa00; }
        .robux-icon { width: 24px; height: 24px; }

        .buy-btn { text-decoration: none; color: white; border: 1px solid var(--red); padding: 12px 25px; border-radius: 8px; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; width: fit-content; font-weight: bold; }
        .buy-btn:hover { background: var(--red); color: black; box-shadow: 0 0 15px var(--red); }

        /* Rain */
        .rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; filter: blur(0.8px); }
        .drop { position: absolute; background: linear-gradient(to bottom, transparent, var(--red)); width: 1px; height: 60px; opacity: 0.3; }

        @media (max-width: 768px) {
            .gallery-item-flex { flex-direction: column; }
            .item-image { flex: 0 0 200px; border-right: none; }
        }
    </style>
</head>
<body>
    <div class="rain-container"></div>
    <a href="index.html" class="back-btn">← EXIT</a>

    <div class="container">
        <h1>Map Archive</h1>
        <p class="subtitle">Highly Detailed Environments</p>

        <div class="gallery-grid">
            <div class="gallery-item-flex">
                <div class="item-image"><img src="chester.png" alt="Chester Map"></div>
                <div class="item-details">
                    <h3>Chester City</h3>
                    <p class="desc">A sprawling urban environment featuring high-fidelity textures, custom lighting, and optimized building interiors.</p>
                    <div class="price-row">
                        <span class="price-usd">$50</span>
                        <span class="price-sep">OR</span>
                        <span class="price-robux"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Robux_2019_Logo_gold.svg" class="robux-icon"> 5,000</span>
                    </div>
                    <a href="https://discord.gg/WaR3h4JqYm" target="_blank" class="buy-btn">Purchase Now</a>
                </div>
            </div>

            <div class="gallery-item-flex">
                <div class="item-image"><img src="utah.png" alt="Utah Map"></div>
                <div class="item-details">
                    <h3>Utah Beach</h3>
                    <p class="desc">D-Day beach - nothing else I have to say.</p>
                    <div class="price-row">
                        <span class="price-usd">$40</span>
                        <span class="price-sep">OR</span>
                        <span class="price-robux"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Robux_2019_Logo_gold.svg" class="robux-icon"> 4,000</span>
                    </div>
                    <a href="https://discord.gg/WaR3h4JqYm" target="_blank" class="buy-btn">Purchase Now</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.querySelector('.rain-container');
        function createRain() {
            const drop = document.createElement('div');
            const posX = Math.random() * window.innerWidth;
            const duration = Math.random() * 0.5 + 0.5;
            drop.style.left = posX + 'px';
            drop.style.animation = `fall ${duration}s linear forwards`;
            drop.classList.add('drop');
            container.appendChild(drop);
            setTimeout(() => { drop.remove(); }, duration * 1000);
        }
        setInterval(createRain, 30);
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `@keyframes fall { to { transform: translateY(100vh); } }`;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
