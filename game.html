<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV | Games Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030303; --red: #ff0000; --glass: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .back-btn { position: fixed; top: 20px; left: 20px; color: var(--red); text-decoration: none; font-weight: bold; z-index: 100; border: 1px solid var(--red); padding: 10px 20px; border-radius: 12px; background: rgba(0,0,0,0.8); transition: 0.3s; letter-spacing: 2px; }
        .back-btn:hover { background: var(--red); color: black; }
        .construction-wrapper { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; z-index: 10; }
        .alert-icon { font-size: 5rem; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--red)); animation: pulse 2s infinite; }
        h1 { font-family: 'UnifrakturMaguntia', serif; color: var(--red); font-size: 5rem; margin: 0; text-shadow: 0 0 30px rgba(255,0,0,0.5); }
        .status-tag { background: rgba(255, 0, 0, 0.1); border: 1px solid var(--red); color: var(--red); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; margin-top: 20px; }
        p { color: #666; max-width: 500px; line-height: 1.6; margin-top: 20px; letter-spacing: 1px; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .drop { position: absolute; background: linear-gradient(to bottom, transparent, var(--red)); width: 1px; height: 60px; opacity: 0.2; }
    </style>
</head>
<body>
    <div class="rain-container"></div>
    <a href="index.html" class="back-btn">← EXIT</a>

    <div class="construction-wrapper">
        <div class="alert-icon">🎮</div>
        <h1>Under Construction</h1>
        <div class="status-tag">Project Files Encrypted</div>
        <p>Full game projects and case studies are being compiled. Access to the game source archive is restricted until further notice.</p>
    </div>

    <script>
        const container = document.querySelector('.rain-container');
        function createRain() {
            const drop = document.createElement('div');
            const posX = Math.random() * window.innerWidth;
            const duration = Math.random() * 0.5 + 0.5;
            drop.style.left = posX + 'px';
            drop.style.animation = `fall ${duration}s linear forwards`;
            drop.classList.add('drop');
            container.appendChild(drop);
            setTimeout(() => { drop.remove(); }, duration * 1000);
        }
        setInterval(createRain, 30);
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `@keyframes fall { to { transform: translateY(100vh); } }`;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
